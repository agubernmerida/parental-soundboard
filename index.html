<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ouder Modus</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e8721c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ouder Modus">
  <link rel="apple-touch-icon" href="icon.svg">
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --primary:      #e8721c;
      --primary-dark: #bf5a12;
      --primary-lt:   #fde8d8;
      --bg:           #fff7ed;
      --surface:      #ffffff;
      --border:       #e5e7eb;
      --danger:       #ef4444;
      --muted:        #6b7280;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    /* ── GATE SCREEN ── */
    .gate-screen {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .gate-card {
      background: var(--surface); border-radius: 22px;
      padding: 32px 24px; width: 100%; max-width: 340px;
      box-shadow: 0 4px 24px rgba(0,0,0,.13);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .gate-icon  { font-size: 3.6rem; }
    .gate-title { font-size: 1.25rem; font-weight: 800; color: var(--primary-dark); }
    .gate-sub   { font-size: .83rem; color: var(--muted); text-align: center; line-height: 1.55; }
    .gate-form  { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .gate-input {
      width: 100%; height: 56px; font-size: 1.1rem;
      border: 2px solid var(--border); border-radius: 13px;
      padding: 0 16px; font-family: inherit; background: var(--bg);
      text-align: center; letter-spacing: .12em;
    }
    .gate-input:focus { outline: none; border-color: var(--primary); }
    .gate-btn {
      width: 100%; height: 56px; background: var(--primary); color: #fff;
      border: none; border-radius: 13px; font-size: 1.05rem; font-weight: 700;
      cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .gate-btn:active { opacity: .86; }
    .gate-error { font-size: .82rem; font-weight: 600; color: var(--danger); min-height: 1.1em; text-align: center; }

    /* ── PLAY MODE ── */
    .play-mode {
      height: 100vh; height: 100dvh; display: flex; flex-direction: column;
      padding: 10px;
      padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    }
    .grid {
      flex: 1; display: grid;
      grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 10px;
    }
    .play-btn {
      width: 100%; height: 100%; background: var(--primary); color: #fff;
      border: none; border-radius: 18px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
      cursor: pointer; font-family: inherit;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
      box-shadow: 0 3px 10px rgba(232,114,28,.35);
    }
    .play-btn.no-audio { background: #e5e7eb; color: #9ca3af; box-shadow: none; cursor: default; }
    .play-btn:active:not(.no-audio) { opacity: .82; }
    .play-btn.flash { animation: btn-flash .3s ease; }
    @keyframes btn-flash {
      0%   { background-color: var(--primary); transform: scale(1); }
      35%  { background-color: #fcd34d; transform: scale(1.07); box-shadow: 0 6px 20px rgba(232,114,28,.55); }
      100% { background-color: var(--primary); transform: scale(1); }
    }
    .btn-emoji { font-size: 2.5rem; line-height: 1; pointer-events: none; }
    .btn-label {
      font-size: .72rem; font-weight: 700; text-align: center;
      line-height: 1.25; word-break: break-word; hyphens: auto;
      padding: 0 4px; pointer-events: none;
    }
    .fab-edit {
      position: fixed; bottom: 14px; right: 14px;
      background: rgba(20,20,20,.72);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      color: #fff; border: none; border-radius: 22px;
      padding: 10px 20px; font-size: .83rem; font-weight: 600;
      cursor: pointer; font-family: inherit; z-index: 100;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── SYNC BADGE ── */
    .sync-badge {
      position: fixed; bottom: 14px; left: 14px;
      font-size: .72rem; font-weight: 700;
      background: rgba(255,255,255,.88); backdrop-filter: blur(4px);
      border-radius: 12px; padding: 5px 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      pointer-events: none; z-index: 99;
      transition: color .3s;
    }

    /* ── EDIT MODE ── */
    .edit-mode { padding: 0 12px 88px; }
    .edit-header {
      position: sticky; top: 0; z-index: 10; background: var(--bg);
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0 12px; border-bottom: 2px solid var(--primary-lt); margin-bottom: 14px;
    }
    .edit-header h1 { font-size: 1.1rem; font-weight: 800; color: var(--primary-dark); }
    .done-btn {
      background: var(--primary); color: #fff; border: none; border-radius: 13px;
      padding: 10px 24px; font-size: .95rem; font-weight: 700;
      cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .btn-list { display: flex; flex-direction: column; gap: 10px; }
    .edit-card {
      background: var(--surface); border-radius: 15px;
      padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.09);
    }
    .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .inp-emoji {
      width: 52px; height: 52px; font-size: 1.6rem; text-align: center;
      border: 2px solid var(--border); border-radius: 11px;
      flex-shrink: 0; font-family: inherit; background: var(--bg);
    }
    .inp-label {
      flex: 1; height: 52px; font-size: .95rem;
      border: 2px solid var(--border); border-radius: 11px;
      padding: 0 12px; font-family: inherit; background: var(--bg);
    }
    .inp-emoji:focus, .inp-label:focus { outline: none; border-color: var(--primary); }
    .btn-delete {
      width: 44px; height: 44px; background: none;
      border: 2px solid var(--border); border-radius: 11px;
      font-size: 1.05rem; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-delete:active { background: #fee2e2; border-color: var(--danger); }
    .card-bottom { display: flex; align-items: center; gap: 8px; }
    .btn-rec {
      height: 42px; padding: 0 14px;
      background: var(--primary-lt); border: 2px solid var(--primary);
      border-radius: 11px; font-size: .82rem; font-weight: 700;
      cursor: pointer; font-family: inherit; color: var(--primary-dark);
      white-space: nowrap; flex-shrink: 0; -webkit-tap-highlight-color: transparent;
    }
    .btn-rec.recording {
      background: #fee2e2; border-color: var(--danger); color: #dc2626;
      animation: rec-pulse .65s ease infinite;
    }
    .btn-rec:disabled { opacity: .45; pointer-events: none; }
    @keyframes rec-pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
    .rec-timer { font-size: .8rem; font-weight: 800; color: #dc2626; flex-shrink: 0; min-width: 28px; }
    .preview-audio { flex: 1; height: 40px; min-width: 80px; max-width: 100%; }
    .btn-add {
      display: block; width: 100%; margin-top: 14px; padding: 15px;
      background: none; border: 2px dashed var(--primary); border-radius: 15px;
      font-size: .95rem; font-weight: 700; color: var(--primary);
      cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .btn-add:active { background: var(--primary-lt); }

    /* ── EDIT SECTIONS ── */
    .edit-section {
      margin-top: 20px; background: var(--surface);
      border-radius: 15px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.09);
    }
    .section-title {
      font-size: .82rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px;
    }
    .section-hint { font-size: .78rem; color: var(--muted); margin-bottom: 10px; line-height: 1.45; }
    .pwd-form { display: flex; flex-direction: column; gap: 10px; }
    .pwd-input {
      width: 100%; height: 48px; font-size: .95rem;
      border: 2px solid var(--border); border-radius: 11px;
      padding: 0 14px; font-family: inherit; background: var(--bg);
    }
    .pwd-input:focus { outline: none; border-color: var(--primary); }
    .btn-save-pwd {
      height: 48px; background: var(--primary); color: #fff;
      border: none; border-radius: 11px; font-size: .95rem; font-weight: 700;
      cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .pwd-feedback { font-size: .82rem; font-weight: 600; min-height: 1.1em; }
    .pwd-feedback.err { color: var(--danger); }
    .pwd-feedback.ok  { color: #16a34a; }
    .btn-secondary {
      width: 100%; height: 48px; background: none;
      border: 2px solid var(--border); border-radius: 11px;
      font-size: .9rem; font-weight: 600; color: var(--muted);
      cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .btn-secondary:active { background: var(--bg); }
  </style>
</head>
<body>
<div id="app"></div>
<div id="sync"></div>
<script>
'use strict';

// ── Configuration ──────────────────────────────────────────────
// After setting up Supabase, replace these two values:
const SUPABASE_URL  = 'https://tjmufmxdxjlmicratpan.supabase.co';
const SUPABASE_ANON = 'sb_publishable_81nSHSx3e_OfyBaDIotPAA_kxFXv-LP';

const STORE  = 'parental-soundboard-v1';
const MAX_MS = 3000;

const DEFAULTS = [
  ['🛑','Stop'],     ['🚫','Niet doen'], ['🤫','Sssht'],
  ['👂','Luister'],  ['🪑','Ga zitten'], ['🍽️','Eten'],
  ['🛏️','Slapen'],  ['😤','Doe normaal'],['🙄','Serieus?']
];

// ── State ───────────────────────────────────────────────────────
let buttons   = [];
let mode      = 'play';
let recId     = null;
let mr        = null;
let recChunks = [];
let recTimer  = null;
let uiTimer   = null;
let recStart  = 0;
let sb        = null;   // Supabase client (null = not configured)
let syncState = 'ok';   // 'syncing' | 'ok' | 'error'
let fieldSyncTimer = null;

// ── Auth helpers ────────────────────────────────────────────────
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
const hasPwd   = () => !!localStorage.getItem('psb-pwd-hash');
const isAuthed = () => localStorage.getItem('psb-authed') === '1' && hasPwd();

// ── Supabase helpers ────────────────────────────────────────────
function initSupabase() {
  if (SUPABASE_URL === 'https://REPLACE.supabase.co') return; // not configured yet
  if (!window.supabase) return;
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
}

function setSyncState(s) {
  syncState = s;
  renderSync();
}

function renderSync() {
  const el = document.getElementById('sync');
  if (!el) return;
  if (!isAuthed() || !sb) { el.innerHTML = ''; return; }
  const icon  = { syncing: '⟳', ok: '✓', error: '✗' }[syncState];
  const color = { syncing: '#9ca3af', ok: '#16a34a', error: '#f97316' }[syncState];
  const label = { syncing: '', ok: '', error: ' offline' }[syncState];
  el.innerHTML = `<div class="sync-badge" style="color:${color}">${icon}${label}</div>`;
}

async function syncFromCloud() {
  if (!sb) return;
  setSyncState('syncing');
  try {
    const { data, error } = await sb.from('buttons').select('*').order('position');
    if (error) { setSyncState('error'); return; }
    if (!data || !data.length) { setSyncState('ok'); return; }
    const localMap = Object.fromEntries(buttons.map(b => [b.id, b]));
    // Cloud wins for emoji/label/position; keep local audio if cloud has none
    buttons = data.map(r => ({
      id: r.id, emoji: r.emoji, label: r.label,
      audio: r.audio ?? localMap[r.id]?.audio ?? null
    }));
    save();
    setSyncState('ok');
    render();
  } catch (_) { setSyncState('error'); }
}

async function saveAndSync(btn) {
  save();
  if (!sb) return;
  setSyncState('syncing');
  try {
    await sb.from('buttons').upsert({
      id: btn.id, emoji: btn.emoji, label: btn.label,
      audio: btn.audio ?? null,
      position: buttons.indexOf(btn),
      updated_at: new Date().toISOString()
    });
    setSyncState('ok');
  } catch (_) { setSyncState('error'); }
}

// ── Gate actions ────────────────────────────────────────────────
async function trySetup() {
  const p1  = document.getElementById('g-p1').value;
  const p2  = document.getElementById('g-p2').value;
  const err = document.getElementById('g-err');
  if (p1.length < 4) { err.textContent = 'Minimaal 4 tekens vereist.'; return; }
  if (p1 !== p2)     { err.textContent = 'Wachtwoorden komen niet overeen.'; return; }
  err.textContent = '';
  localStorage.setItem('psb-pwd-hash', await sha256(p1));
  localStorage.setItem('psb-authed', '1');
  initSupabase();
  mode = 'play'; render();
  loadDefaults();
  syncFromCloud();
}

async function tryLogin() {
  const pwd = document.getElementById('g-pwd').value;
  const err = document.getElementById('g-err');
  if ((await sha256(pwd)) === localStorage.getItem('psb-pwd-hash')) {
    localStorage.setItem('psb-authed', '1');
    initSupabase();
    mode = 'play'; render();
    loadDefaults();
    syncFromCloud();
  } else {
    err.textContent = 'Verkeerd wachtwoord. Probeer opnieuw.';
    document.getElementById('g-pwd').value = '';
    document.getElementById('g-pwd').focus();
  }
}

async function changePwd() {
  const cur = document.getElementById('cp-cur').value;
  const p1  = document.getElementById('cp-p1').value;
  const p2  = document.getElementById('cp-p2').value;
  const fb  = document.getElementById('cp-fb');
  if ((await sha256(cur)) !== localStorage.getItem('psb-pwd-hash')) {
    fb.className = 'pwd-feedback err'; fb.textContent = 'Huidig wachtwoord klopt niet.'; return;
  }
  if (p1.length < 4) { fb.className = 'pwd-feedback err'; fb.textContent = 'Minimaal 4 tekens.'; return; }
  if (p1 !== p2)     { fb.className = 'pwd-feedback err'; fb.textContent = 'Wachtwoorden komen niet overeen.'; return; }
  localStorage.setItem('psb-pwd-hash', await sha256(p1));
  fb.className = 'pwd-feedback ok'; fb.textContent = '✓ Wachtwoord opgeslagen!';
  document.getElementById('cp-cur').value = '';
  document.getElementById('cp-p1').value  = '';
  document.getElementById('cp-p2').value  = '';
}

// ── Persistence ─────────────────────────────────────────────────
function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) buttons = JSON.parse(raw).buttons || [];
  } catch (_) {}
  if (!buttons.length) {
    let n = 1;
    buttons = DEFAULTS.map(([emoji, label]) =>
      ({ id: String(n++), emoji, label, audio: null })
    );
  }
}

async function loadDefaults() {
  if (buttons.every(b => b.audio)) return; // all buttons already have audio
  try {
    const res = await fetch('./sounds/defaults.json');
    if (!res.ok) return;
    const defs = await res.json();
    let changed = false;
    buttons.forEach(b => {
      if (!b.audio && defs[b.id]) { b.audio = defs[b.id]; changed = true; }
    });
    if (changed) { save(); if (isAuthed()) render(); }
  } catch (_) {}
}

function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ buttons })); }
  catch (_) { alert('Opslag vol! Verwijder een opname.'); }
}

// ── UID ─────────────────────────────────────────────────────────
let _c = Date.now();
function uid() { return (++_c).toString(36); }

// ── Recording ───────────────────────────────────────────────────
async function startRec(id) {
  if (recId) return;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (_) { alert('Microfoon toegang geweigerd.'); return; }

  recId = id; recChunks = []; recStart = Date.now();
  mr = new MediaRecorder(stream);
  mr.ondataavailable = e => { if (e.data && e.data.size > 0) recChunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    clearTimeout(recTimer); clearInterval(uiTimer);
    const blob = new Blob(recChunks, { type: mr.mimeType || 'audio/webm' });
    const reader = new FileReader();
    reader.onloadend = async () => {
      const btn = buttons.find(b => b.id === recId);
      if (btn) { btn.audio = reader.result; await saveAndSync(btn); }
      recId = null; mr = null; render();
    };
    reader.readAsDataURL(blob);
  };
  mr.start(100);
  recTimer = setTimeout(stopRec, MAX_MS);
  uiTimer  = setInterval(() => {
    const el = document.getElementById('rec-timer');
    if (el) el.textContent = (Math.max(0, MAX_MS - (Date.now() - recStart)) / 1000).toFixed(1) + 's';
  }, 80);
  render();
}

function stopRec() {
  clearTimeout(recTimer); clearInterval(uiTimer);
  if (mr && mr.state !== 'inactive') mr.stop();
}

// ── Button management ────────────────────────────────────────────
async function addBtn() {
  const btn = { id: uid(), emoji: '🔊', label: 'Nieuw', audio: null };
  buttons.push(btn);
  save();
  if (sb) {
    setSyncState('syncing');
    try {
      await sb.from('buttons').insert({
        id: btn.id, emoji: btn.emoji, label: btn.label,
        audio: null, position: buttons.length - 1,
        updated_at: new Date().toISOString()
      });
      setSyncState('ok');
    } catch (_) { setSyncState('error'); }
  }
  render();
}

async function delBtn(id) {
  if (recId === id) stopRec();
  buttons = buttons.filter(b => b.id !== id);
  save();
  if (sb) {
    setSyncState('syncing');
    try {
      await sb.from('buttons').delete().eq('id', id);
      setSyncState('ok');
    } catch (_) { setSyncState('error'); }
  }
  render();
}

function setField(id, field, val) {
  const b = buttons.find(b => b.id === id);
  if (!b) return;
  b[field] = val;
  save();
  clearTimeout(fieldSyncTimer);
  fieldSyncTimer = setTimeout(() => saveAndSync(b), 1500);
}

function exportDefaults() {
  const obj = {};
  buttons.forEach(b => { if (b.audio) obj[b.id] = b.audio; });
  if (!Object.keys(obj).length) {
    alert('Geen opnames gevonden. Neem eerst alle knoppen op.');
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj)], { type: 'application/json' }));
  a.download = 'defaults.json';
  a.click();
}

// ── Playback ─────────────────────────────────────────────────────
function play(id) {
  const btn = buttons.find(b => b.id === id);
  if (!btn || !btn.audio) return;
  new Audio(btn.audio).play().catch(() => {});
  const el = document.getElementById('pb-' + id);
  if (el) {
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 340);
  }
}

// ── Mode ─────────────────────────────────────────────────────────
function goMode(m) { if (recId) stopRec(); mode = m; render(); }

// ── Escape helpers ───────────────────────────────────────────────
function eh(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ea(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

// ── Render ───────────────────────────────────────────────────────
function render() {
  if (!isAuthed()) { renderGate(); renderSync(); return; }
  document.getElementById('app').innerHTML =
    mode === 'play' ? renderPlay() : renderEdit();
  renderSync();
}

function renderGate() {
  document.getElementById('app').innerHTML = !hasPwd() ? `
    <div class="gate-screen">
      <div class="gate-card">
        <div class="gate-icon">🔒</div>
        <div class="gate-title">Ouder Modus</div>
        <div class="gate-sub">Stel een wachtwoord in.<br>Je hebt het nodig om de app te openen.</div>
        <form class="gate-form" onsubmit="trySetup(); return false;">
          <input id="g-p1" class="gate-input" type="password"
                 placeholder="Wachtwoord kiezen (min. 4 tekens)"
                 autocomplete="new-password" autofocus>
          <input id="g-p2" class="gate-input" type="password"
                 placeholder="Herhaal wachtwoord" autocomplete="new-password">
          <div id="g-err" class="gate-error"></div>
          <button class="gate-btn" type="submit">Instellen &amp; openen</button>
        </form>
      </div>
    </div>
  ` : `
    <div class="gate-screen">
      <div class="gate-card">
        <div class="gate-icon">🔐</div>
        <div class="gate-title">Ouder Modus</div>
        <form class="gate-form" onsubmit="tryLogin(); return false;">
          <input id="g-pwd" class="gate-input" type="password"
                 placeholder="Wachtwoord" autocomplete="current-password" autofocus>
          <div id="g-err" class="gate-error"></div>
          <button class="gate-btn" type="submit">Ontgrendel</button>
        </form>
      </div>
    </div>
  `;
}

function renderPlay() {
  const btns = buttons.map(b => `
    <button class="play-btn${b.audio ? '' : ' no-audio'}"
            id="pb-${b.id}" onclick="play('${b.id}')">
      <span class="btn-emoji">${eh(b.emoji)}</span>
      <span class="btn-label">${eh(b.label)}</span>
    </button>`).join('');
  return `
    <div class="play-mode"><div class="grid">${btns}</div></div>
    <button class="fab-edit" onclick="goMode('edit')">✏️ Bewerken</button>`;
}

function renderEdit() {
  const rows = buttons.map(b => {
    const isRec    = recId === b.id;
    const otherRec = recId && !isRec;
    return `
      <div class="edit-card">
        <div class="card-top">
          <input class="inp-emoji" value="${ea(b.emoji)}" maxlength="4"
                 oninput="setField('${b.id}','emoji',this.value)">
          <input class="inp-label" value="${ea(b.label)}" placeholder="Label"
                 oninput="setField('${b.id}','label',this.value)">
          <button class="btn-delete" onclick="delBtn('${b.id}')" title="Verwijderen">🗑</button>
        </div>
        <div class="card-bottom">
          <button class="btn-rec${isRec ? ' recording' : ''}"
                  onclick="${isRec ? 'stopRec()' : `startRec('${b.id}')`}"
                  ${otherRec ? 'disabled' : ''}>
            ${isRec ? '⏹ Stop opname' : (b.audio ? '🔄 Opnieuw' : '🎙 Opnemen')}
          </button>
          ${isRec ? '<span class="rec-timer" id="rec-timer">3.0s</span>' : ''}
          ${b.audio && !isRec
            ? `<audio class="preview-audio" controls src="${ea(b.audio)}"></audio>` : ''}
        </div>
      </div>`;
  }).join('');
  return `
    <div class="edit-mode">
      <div class="edit-header">
        <h1>✏️ Knoppen bewerken</h1>
        <button class="done-btn" onclick="goMode('play')">Klaar ✓</button>
      </div>
      <div class="btn-list">${rows}</div>
      <button class="btn-add" onclick="addBtn()">＋ Knop toevoegen</button>

      <div class="edit-section">
        <div class="section-title">🔒 Wachtwoord wijzigen</div>
        <form class="pwd-form" onsubmit="changePwd(); return false;">
          <input id="cp-cur" class="pwd-input" type="password"
                 placeholder="Huidig wachtwoord" autocomplete="current-password">
          <input id="cp-p1"  class="pwd-input" type="password"
                 placeholder="Nieuw wachtwoord" autocomplete="new-password">
          <input id="cp-p2"  class="pwd-input" type="password"
                 placeholder="Nieuw wachtwoord herhalen" autocomplete="new-password">
          <div id="cp-fb" class="pwd-feedback"></div>
          <button class="btn-save-pwd" type="submit">Wachtwoord opslaan</button>
        </form>
      </div>

      <div class="edit-section">
        <div class="section-title">⬇ Standaardgeluiden exporteren</div>
        <p class="section-hint">
          Neem alle knoppen op, klik daarna op exporteer. Stuur het bestand naar de ontwikkelaar
          om het als standaard in de app op te nemen.
        </p>
        <button class="btn-secondary" onclick="exportDefaults()">Exporteer defaults.json</button>
      </div>
    </div>`;
}

// ── Service worker ────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('./service-worker.js').catch(console.warn)
  );
}

// ── Init ─────────────────────────────────────────────────────────
loadLocal();
if (isAuthed()) initSupabase();
render();
loadDefaults();
if (isAuthed() && sb) syncFromCloud();
</script>
</body>
</html>
